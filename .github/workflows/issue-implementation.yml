name: Issue Implementation Automation

# Analyzes issues labeled for implementation. Does NOT build the monorepo —
# CI (ci.yml) owns lint/typecheck/test/build with turbo --affected.
#
# Note: scripts/issue-analyzer.ps1 is not present in this repo; analysis steps
# are continue-on-error and will no-op until that script is restored/relocated.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: string

  issues:
    types: [labeled, assigned]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-impl-${{ github.event.inputs.issue_number || github.event.issue.number || github.sha }}
  cancel-in-progress: true

jobs:
  implement-issue:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.label.name, 'ready-to-implement') ||
      contains(github.event.label.name, 'priority: high')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Determine Issue Number
        id: issue-number
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # No pnpm/npm install — this job only needs git + gh + PowerShell scripts.
      # Previously used `npm install` (wrong package manager) and burned minutes.

      - name: Validate Issue Number
        env:
          ISSUE_NUMBER: ${{ steps.issue-number.outputs.number }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Error: Issue number is not available"
            exit 1
          fi
          echo "Implementing Issue #$ISSUE_NUMBER"
          gh auth status

      - name: Run Issue Analysis
        env:
          ISSUE_NUMBER: ${{ steps.issue-number.outputs.number }}
        continue-on-error: true
        run: |
          if [ ! -f scripts/issue-analyzer.ps1 ]; then
            echo "scripts/issue-analyzer.ps1 not found — skipping automated analysis."
            echo "Use local scripts under scripts/issue-management/ if available."
            exit 0
          fi
          pwsh scripts/issue-analyzer.ps1 -IssueNumber "$ISSUE_NUMBER" -GeneratePlan -ExportTo "issue-$ISSUE_NUMBER-analysis.json"

      - name: Comment Analysis Results
        env:
          ISSUE_NUMBER: ${{ steps.issue-number.outputs.number }}
        continue-on-error: true
        run: |
          ANALYSIS_COMMENT="## Issue Implementation Analysis

          Automation checked Issue #$ISSUE_NUMBER.

          ### Next Steps
          1. Review the issue acceptance criteria
          2. Implement on a branch targeting \`develop\`
          3. Let CI (\`ci.yml\`) validate with \`turbo --affected\`
          4. Open a PR — do not rely on this workflow for builds

          **Status**: Analysis job finished (script may be absent — see job logs)."

          gh issue comment "$ISSUE_NUMBER" --body "$ANALYSIS_COMMENT"

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: issue-${{ steps.issue-number.outputs.number }}-analysis-files
          path: |
            issue-${{ steps.issue-number.outputs.number }}-implementation-plan.md
            issue-${{ steps.issue-number.outputs.number }}-analysis.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Generate Implementation Summary
        env:
          ISSUE_NUMBER: ${{ steps.issue-number.outputs.number }}
        continue-on-error: true
        run: |
          {
            echo "## Issue Implementation Analysis for Issue #$ISSUE_NUMBER"
            echo ""
            echo "- No monorepo install/build in this workflow (CI owns that)."
            echo "- Artifacts uploaded when analysis scripts produce them."
          } >> "$GITHUB_STEP_SUMMARY"
