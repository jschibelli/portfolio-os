name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Feature-branch work is validated via PRs (affected). Direct pushes only
    # on integration/production branches; weekly schedule covers full-repo.
    branches: [develop, main]
  schedule:
    # Weekly full-repo verification (intentional exception to --affected)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      full_repo:
        description: "Run full-repo lint/typecheck/test/build (ignore --affected)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turborepo remote cache (optional — set repo secrets to enable):
#   TURBO_TOKEN, TURBO_TEAM, TURBO_REMOTE_CACHE_SIGNATURE_KEY
# signature:true in turbo.json requires the signature key when remote cache is used.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FULL_REPO: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_repo == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Required for turbo --affected merge-base detection
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "20"
          pnpm-version: "10.14.0"

      - name: Security audit
        continue-on-error: true
        run: |
          echo "Running security audit (non-blocking)..."
          pnpm audit --audit-level=high || true

      - name: Resolve turbo scope
        id: scope
        run: |
          if [ "${{ env.FULL_REPO }}" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Using full-repo verification (schedule / manual)."
            exit 0
          fi

          echo "mode=affected" >> "$GITHUB_OUTPUT"

          # Prefer PR base SHA; on push use previous commit; fall back to origin/main.
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi

          echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Using turbo --affected with TURBO_SCM_BASE=$BASE"

      # Lint + typecheck share one turbo invocation (single graph walk).
      - name: Lint & typecheck (affected)
        if: steps.scope.outputs.mode == 'affected'
        continue-on-error: true
        run: pnpm exec turbo run lint typecheck --affected --continue

      - name: Test (affected)
        if: steps.scope.outputs.mode == 'affected'
        continue-on-error: true
        run: pnpm exec turbo run test --affected --continue -- --ci --passWithNoTests

      - name: Build (affected)
        if: steps.scope.outputs.mode == 'affected'
        run: pnpm exec turbo run build --affected

      - name: Lint & typecheck (full repo)
        if: steps.scope.outputs.mode == 'full'
        continue-on-error: true
        run: pnpm exec turbo run lint typecheck --continue

      - name: Test (full repo)
        if: steps.scope.outputs.mode == 'full'
        continue-on-error: true
        run: pnpm exec turbo run test --continue -- --ci --passWithNoTests

      - name: Build (full repo)
        if: steps.scope.outputs.mode == 'full'
        run: pnpm exec turbo run build

      - name: Verify site artifacts when built
        run: |
          if [ ! -d "apps/site/.next" ]; then
            echo "Site was not in this run's build graph (unaffected) — skipping artifact check."
            exit 0
          fi
          echo "Site .next present"
          test -f apps/site/.next/BUILD_ID
          echo "BUILD_ID=$(cat apps/site/.next/BUILD_ID)"

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Mode: \`${{ steps.scope.outputs.mode }}\`"
            echo "- Affected base: \`${TURBO_SCM_BASE:-default}\`"
            echo "- Remote cache: $([ -n \"${TURBO_TOKEN:-}\" ] && echo enabled || echo 'disabled — set TURBO_TOKEN/TURBO_TEAM/TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets')"
            echo "- Site artifacts: $([ -d apps/site/.next ] && echo present || echo not built this run)"
            echo "- Dashboard artifacts: $([ -d apps/dashboard/.next ] && echo present || echo not built this run)"
            echo "- Docs artifacts: $([ -d apps/docs/.next ] && echo present || echo not built this run)"
            echo ""
            if [ "${{ steps.scope.outputs.mode }}" = "full" ]; then
              echo "Full-repo verification run (schedule / manual dispatch)."
            else
              echo "PR/branch run used \`turbo run … --affected\` so unrelated apps were skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip Storybook entirely when the event cannot touch the site package.
    # Schedule/full-repo still runs so Storybook stays green weekly.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect site changes (cheap path filter)
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/chatbot/**'
              - 'packages/db/**'
              - 'packages/emails/**'
              - 'packages/lib/**'
              - 'packages/ui/**'
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'package.json'

      - name: Setup Node + pnpm
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.paths.outputs.site == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "20"
          pnpm-version: "10.14.0"

      - name: Configure affected base
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.paths.outputs.site == 'true'
        run: |
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi
          echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Build Storybook when site is affected
        id: storybook
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.paths.outputs.site == 'true'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_repo }}" = "true" ]; }; then
            pnpm exec turbo run build-storybook --filter=@mindware-blog/site
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFFECTED_JSON=$(pnpm exec turbo run build --filter=@mindware-blog/site --affected --dry=json)
          if ! echo "$AFFECTED_JSON" | grep -q '"@mindware-blog/site#build"'; then
            echo "Site unaffected; skipping Storybook."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec turbo run build-storybook --filter=@mindware-blog/site
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Upload Storybook artifact
        if: steps.storybook.outcome == 'success' && steps.storybook.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/site/storybook-static
          retention-days: 7
          if-no-files-found: ignore
