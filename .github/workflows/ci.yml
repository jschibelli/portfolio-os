name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Feature-branch work is validated via PRs (affected). Direct pushes only
    # on integration/production branches; weekly schedule covers full-repo.
    branches: [develop, main]
  schedule:
    # Weekly full-repo verification (intentional exception to --affected)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      full_repo:
        description: "Run full-repo lint/typecheck/test/build (ignore --affected)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turborepo remote cache (optional — set repo secrets to enable):
#   TURBO_TOKEN, TURBO_TEAM, TURBO_REMOTE_CACHE_SIGNATURE_KEY
# signature:true in turbo.json requires the signature key when remote cache is used.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  detect-affected:
    name: Detect affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
      has_playwright: ${{ steps.detect.outputs.has_playwright }}
      mode: ${{ steps.detect.outputs.mode }}
      base: ${{ steps.detect.outputs.base }}
      reason: ${{ steps.detect.outputs.reason }}
    env:
      FULL_REPO: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_repo == 'true') }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so turbo --affected / merge-base can see the PR base
          # and the previous push SHA. Shallow clones make affected detection
          # silently wrong.
          fetch-depth: 0

      - name: Ensure PR base ref is present
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" || \
            git fetch --no-tags origin "${{ github.base_ref }}" || true

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "20"
          pnpm-version: "10.14.0"

      - name: Security audit
        continue-on-error: true
        run: |
          echo "Running security audit (non-blocking)..."
          pnpm audit --audit-level=high || true

      - name: Test affected-app detector
        run: pnpm run ci:affected:test

      - name: Resolve affected deployable apps
        id: detect
        run: |
          extras=()
          if [ "${FULL_REPO}" = "true" ]; then
            extras+=(--full)
          fi
          node .github/scripts/affected-apps.mjs --github "${extras[@]}"

  build-app:
    name: ${{ matrix.app.id }}
    needs: detect-affected
    if: needs.detect-affected.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-affected.outputs.apps) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "20"
          pnpm-version: "10.14.0"

      - name: Lint
        if: ${{ matrix.app.lint }}
        continue-on-error: true
        run: pnpm exec turbo run lint --filter="${{ matrix.app.filter }}" --continue

      - name: Typecheck
        if: ${{ matrix.app.typecheck }}
        continue-on-error: true
        run: pnpm exec turbo run typecheck --filter="${{ matrix.app.filter }}" --continue

      - name: Test
        if: ${{ matrix.app.test }}
        continue-on-error: true
        run: pnpm exec turbo run test --filter="${{ matrix.app.filter }}" --continue -- --ci --passWithNoTests

      - name: Generate Prisma client
        if: ${{ matrix.app.prisma == true || matrix.app.prisma == 'true' }}
        run: |
          pnpm exec prisma generate --schema=packages/db/prisma/schema.prisma
          if [ -f "${{ matrix.app.dir }}/prisma/schema.prisma" ]; then
            pnpm exec prisma generate --schema="${{ matrix.app.dir }}/prisma/schema.prisma"
          fi

      - name: Build
        if: ${{ matrix.app.build }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec turbo run build --filter="${{ matrix.app.filter }}"

      - name: Verify Next.js artifacts
        if: ${{ matrix.app.build }}
        run: |
          test -d "${{ matrix.app.dir }}/.next"
          test -f "${{ matrix.app.dir }}/.next/BUILD_ID"
          echo "BUILD_ID=$(cat "${{ matrix.app.dir }}/.next/BUILD_ID")"

      - name: Storybook
        id: storybook
        if: ${{ matrix.app.storybook }}
        continue-on-error: true
        run: pnpm exec turbo run build-storybook --filter="${{ matrix.app.filter }}"

      - name: Upload Storybook artifact
        if: ${{ always() && (matrix.app.storybook == true || matrix.app.storybook == 'true') && steps.storybook.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ matrix.app.id }}
          path: ${{ matrix.app.dir }}/storybook-static
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          APP_ID: ${{ matrix.app.id }}
          APP_PACKAGE: ${{ matrix.app.package }}
          APP_FILTER: ${{ matrix.app.filter }}
          APP_LINT: ${{ matrix.app.lint }}
          APP_TYPECHECK: ${{ matrix.app.typecheck }}
          APP_TEST: ${{ matrix.app.test }}
          APP_BUILD: ${{ matrix.app.build }}
          APP_STORYBOOK: ${{ matrix.app.storybook }}
          APP_PLAYWRIGHT: ${{ matrix.app.playwright }}
        run: |
          if [ -n "${TURBO_TOKEN:-}" ]; then
            REMOTE_CACHE="enabled"
          else
            REMOTE_CACHE="disabled (set TURBO_TOKEN/TURBO_TEAM/TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets)"
          fi
          {
            echo "## ${APP_ID}"
            echo ""
            echo "- Package: ${APP_PACKAGE}"
            echo "- Filter: ${APP_FILTER}"
            echo "- Lint: ${APP_LINT}"
            echo "- Typecheck: ${APP_TYPECHECK}"
            echo "- Test: ${APP_TEST}"
            echo "- Build: ${APP_BUILD}"
            echo "- Storybook: ${APP_STORYBOOK}"
            echo "- Playwright: ${APP_PLAYWRIGHT} (e2e-optimized.yml when true)"
            echo "- Remote cache: ${REMOTE_CACHE}"
          } >> "${GITHUB_STEP_SUMMARY}"

  ci-summary:
    name: CI summary
    needs: [detect-affected, build-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Workflow summary
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Mode: \`${{ needs.detect-affected.outputs.mode }}\`"
            echo "- Affected base: \`${{ needs.detect-affected.outputs.base }}\`"
            echo "- Reason: \`${{ needs.detect-affected.outputs.reason }}\`"
            echo "- Matrix: \`${{ needs.detect-affected.outputs.apps }}\`"
            echo "- App jobs: ${{ needs.build-app.result }}"
            echo "- Playwright requested: \`${{ needs.detect-affected.outputs.has_playwright }}\` (e2e-optimized.yml)"
            echo ""
            echo "PR/push runs detect affected deployable apps via turbo ls --affected, then one job per app with --filter=<pkg>..."
            echo "--filter is never combined with --affected (Turbo 2.5.8 rejects that pairing)."
            echo "Unrelated apps are not built. Shared-package changes still fan out through Turbo's dependency graph."
          } >> "$GITHUB_STEP_SUMMARY"
