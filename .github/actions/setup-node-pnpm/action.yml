name: Setup Node + pnpm
description: Shared setup for Node and pnpm with store cache and optional install

inputs:
  node-version:
    description: Node.js version to use (recommend LTS, pinned for reproducible CI)
    required: false
    default: "20"
  pnpm-version:
    description: pnpm version to install (pinned for reproducible CI)
    required: false
    default: "10.14.0"
  install:
    description: Whether to run pnpm install
    required: false
    default: "true"
  frozen-lockfile:
    description: Whether to enforce the lockfile
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # pnpm must be on PATH before setup-node cache: pnpm can resolve the store
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm --version
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
